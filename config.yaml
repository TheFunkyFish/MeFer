# Optimized for Qwen 3.8 27B on 32 GB VRAM (RTX 3060 Ampere architecture)

# --- Core Model & Hardware Offloading ---
model_path: "/opt/models/Qwen3.8-27B-UD-IQ3_S.gguf"
n_gpu_layers: 999             # Offload all 64 layers to VRAM (~16.5 GB for Q4_K_M)
split_mode: 1                # 1 = LAYER split (best for PCIe multi-GPU setups)
main_gpu: 0
tensor_split: null           # For 3x RTX 3060 (12GB each), set to: [0.33, 0.33, 0.34]
rpc_servers: null
vocab_only: false
use_mmap: false               # Fast disk mapping; keeps system RAM overhead low
use_mlock: false             # Prevents locking RAM unnecessarily when full GPU offloaded
check_tensors: false
kv_overrides: null

# --- Context & Batching (Tuned for Ampere & 32 GB VRAM) ---
n_ctx: 131072                 # Fits comfortably in remaining ~15 GB VRAM with f16 KV cache
n_batch: 1024                # Balanced prompt processing speed for RTX 3060 memory bandwidth
n_ubatch: 512                # Physical micro-batch size for Ampere tensor cores
n_threads: 8                 # Set to physical CPU core count (used for prompt/token prep)
n_threads_batch: 8

# --- RoPE Scaling & Attention ---
rope_scaling_type: -1        # -1 = default (native up to 262,144 tokens)
pooling_type: -1
attention_type: -1
flash_attn: true             # Supported on RTX 3060 (sm_86); cuts VRAM usage & boosts speed
rope_freq_base: 0.0
rope_freq_scale: 0.0
yarn_ext_factor: -1.0
yarn_attn_factor: 1.0
yarn_beta_fast: 32.0
yarn_beta_slow: 1.0
yarn_orig_ctx: 262144

# --- KV Cache & Memory Precision ---
type_k: 1                    # 1 = f16 (prevents reasoning degradation on long chains)
type_v: 1                    # 1 = f16 (requires flash_attn: true for optimal speed)
offload_kqv: true            # Keep KV cache in GPU VRAM
no_perf: false

# --- Generation, Chat & Adapters ---
logits_all: false
embedding: false
seed: -1
max_tokens: 131072             # Allows full thinking + response blocks without cutoffs
last_n_tokens_size: 64
lora_base: null
lora_scale: 1.0
lora_path: null
numa: false
chat_format: null            # Auto-loads Qwen 3.8 ChatML & <think> template from GGUF
chat_handler: null
draft_model: null
tokenizer: null
verbose: true
reasoning: false
reasoning_effort: 0

